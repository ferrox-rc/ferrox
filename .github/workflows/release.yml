name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Firmware Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: llvm-tools-preview

      - name: Install cargo-binutils
        run: cargo install cargo-binutils || true

      - name: Build firmware (release)
        run: |
          cargo build --release -p ferrox-i6s --target thumbv6m-none-eabi
          cargo build --release -p ferrox-i6x --target thumbv6m-none-eabi

      - name: Generate Binary and Hex Artifacts
        run: |
          # FlySky FS-i6S
          cargo objcopy --bin ferrox-i6s --release -- -O binary ferrox-i6s.bin
          cargo objcopy --bin ferrox-i6s --release -- -O ihex ferrox-i6s.hex
          cp target/thumbv6m-none-eabi/release/ferrox-i6s ferrox-i6s.elf

          # FlySky FS-i6X
          cargo objcopy --bin ferrox-i6x --release -- -O binary ferrox-i6x.bin
          cargo objcopy --bin ferrox-i6x --release -- -O ihex ferrox-i6x.hex
          cp target/thumbv6m-none-eabi/release/ferrox-i6x ferrox-i6x.elf

          sha256sum ferrox-i6s.bin ferrox-i6s.hex ferrox-i6s.elf \
                    ferrox-i6x.bin ferrox-i6x.hex ferrox-i6x.elf > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.bin
            *.hex
            *.elf
            sha256sums.txt
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Firmware Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf
          components: llvm-tools-preview

      - name: Install cargo-binutils
        run: cargo install cargo-binutils || true

      - name: Build & Package Firmware Artifacts
        run: |
          mkdir -p release-artifacts

          # STM32F0 targets (FlySky FS-i6S / FS-i6X)
          for board in i6s i6x; do
            pkg="ferrox-${board}"
            echo "=== Building ${pkg} ==="
            cargo build --release -p "${pkg}" --target thumbv6m-none-eabi
            cargo objcopy -p "${pkg}" --bin "${pkg}" --release --target thumbv6m-none-eabi -- -O binary "release-artifacts/${pkg}.bin"
            cargo objcopy -p "${pkg}" --bin "${pkg}" --release --target thumbv6m-none-eabi -- -O ihex "release-artifacts/${pkg}.hex"
            cp "target/thumbv6m-none-eabi/release/${pkg}" "release-artifacts/${pkg}.elf"
          done

          # STM32F4 targets: EdgeTX-derived radios (feature-selected via ferrox-f4)
          for board in pocket boxer zorro tx12 qx7 tprov2 t12 x9d x9e at9spro gx12; do
            echo "=== Building ferrox-${board} ==="
            cargo build --release -p ferrox-f4 --no-default-features --features "${board}" --target thumbv7em-none-eabihf
            cargo objcopy -p ferrox-f4 --bin ferrox-f4 --release --no-default-features --features "${board}" --target thumbv7em-none-eabihf -- -O binary "release-artifacts/ferrox-${board}.bin"
            cargo objcopy -p ferrox-f4 --bin ferrox-f4 --release --no-default-features --features "${board}" --target thumbv7em-none-eabihf -- -O ihex "release-artifacts/ferrox-${board}.hex"
            cp "target/thumbv7em-none-eabihf/release/ferrox-f4" "release-artifacts/ferrox-${board}.elf"
          done

          # EdgeTX bootloader-flashable SD .bin images (32 KiB padded, linked at 0x08008000)
          for board in pocket boxer zorro tx12 qx7 tprov2 t12 x9d x9e at9spro gx12; do
            echo "=== Building ferrox-${board}-sd.bin ==="
            ./tools/build-sd-bin.sh "${board}" "release-artifacts/ferrox-${board}-sd.bin"
          done

          (cd release-artifacts && sha256sum *.bin *.hex *.elf > sha256sums.txt && cat sha256sums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.bin
            release-artifacts/*.hex
            release-artifacts/*.elf
            release-artifacts/sha256sums.txt
          generate_release_notes: true

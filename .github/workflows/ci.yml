name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: Check, Clippy & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy (-D warnings)
        run: |
          cargo clippy -p ferrox-i6s --target thumbv6m-none-eabi -- -D warnings
          cargo clippy -p ferrox-i6x --target thumbv6m-none-eabi -- -D warnings
          cargo clippy -p ferrox-pocket --target thumbv7em-none-eabihf -- -D warnings

      - name: Run host unit tests
        run: |
          cargo test-host-i6s
          cargo test-host-i6x
          cargo test-host-pocket

      - name: Build release binaries
        run: |
          cargo build --release -p ferrox-i6s --target thumbv6m-none-eabi
          cargo build --release -p ferrox-i6x --target thumbv6m-none-eabi
          cargo build --release -p ferrox-pocket --target thumbv7em-none-eabihf

      - name: Install cargo-binutils
        run: cargo install cargo-binutils || true

      - name: Check binary footprints
        run: |
          cargo size -p ferrox-i6s --bin ferrox-i6s --release -- -A
          cargo size -p ferrox-i6x --bin ferrox-i6x --release -- -A
          cargo size -p ferrox-pocket --bin ferrox-pocket --release -- -A

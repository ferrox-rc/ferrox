[package]
name = "ferrox-stm32f4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4 = { version = "0.15", features = ["stm32f407", "rt"] }
ferrox-core = { path = "../ferrox-core", default-features = false, features = ["board-pocket"] }

[features]
default = []
edgetx-bootloader = []

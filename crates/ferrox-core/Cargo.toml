[package]
name = "ferrox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ferrox_core"
path = "src/lib.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-graphics = "0.8.1"

[features]
default = []
board-i6s = ["touch", "rf-afhds2a", "rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-i6x = ["rf-afhds2a", "rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-pocket = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-pocket-cc2500 = ["board-pocket", "rf-cc2500"]
board-boxer = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-zorro = ["rf-crsf", "rf-cc2500", "rf-dsm", "dsm-fwd-prog"]
board-zorro-cc2500 = ["board-zorro"]
board-tx12 = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-qx7 = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-tprov2 = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-t12 = ["rf-crsf", "rf-cc2500", "rf-dsm", "dsm-fwd-prog"]
board-x9d = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-x9e = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
board-at9spro = ["rf-crsf", "rf-cc2500", "rf-dsm", "dsm-fwd-prog"]
board-gx12 = ["rf-crsf", "rf-dsm", "dsm-fwd-prog"]
touch = []
rf-afhds2a = []
rf-crsf = []
rf-cc2500 = []
rf-dsm = []
dsm-fwd-prog = ["rf-dsm"]
stm32 = []
apm32 = []

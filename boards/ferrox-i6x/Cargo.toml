[package]
name = "ferrox-i6x"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ferrox_i6x"
path = "src/lib.rs"

[[bin]]
name = "ferrox-i6x"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrox-core = { path = "../../crates/ferrox-core", default-features = false, features = ["board-i6x"] }
ferrox-stm32f0 = { path = "../../crates/ferrox-stm32f0" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt"] }
embedded-graphics = "0.8.1"

[features]
default = ["stm32"]
stm32 = ["ferrox-core/stm32"]
apm32 = ["ferrox-core/apm32"]

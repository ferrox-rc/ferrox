[package]
name = "ferrox-f4"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ferrox-f4"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrox-core = { path = "../../crates/ferrox-core", default-features = false }
ferrox-stm32f4 = { path = "../../crates/ferrox-stm32f4", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4 = { version = "0.15", features = ["stm32f407", "rt"] }

[features]
default = ["pocket"]
pocket = ["ferrox-core/board-pocket", "ferrox-stm32f4/board-pocket"]
boxer = ["ferrox-core/board-boxer", "ferrox-stm32f4/board-boxer"]
zorro = ["ferrox-core/board-zorro", "ferrox-stm32f4/board-zorro"]
tx12 = ["ferrox-core/board-tx12", "ferrox-stm32f4/board-tx12"]
qx7 = ["ferrox-core/board-qx7", "ferrox-stm32f4/board-qx7"]
tprov2 = ["ferrox-core/board-tprov2", "ferrox-stm32f4/board-tprov2"]
t12 = ["ferrox-core/board-t12", "ferrox-stm32f4/board-t12"]
x9d = ["ferrox-core/board-x9d", "ferrox-stm32f4/board-x9d"]
x9e = ["ferrox-core/board-x9e", "ferrox-stm32f4/board-x9e"]
at9spro = ["ferrox-core/board-at9spro", "ferrox-stm32f4/board-at9spro"]
gx12 = ["ferrox-core/board-gx12", "ferrox-stm32f4/board-gx12"]
edgetx-bootloader = ["ferrox-stm32f4/edgetx-bootloader"]
multiswitch = ["ferrox-core/multiswitch", "ferrox-stm32f4/multiswitch"]

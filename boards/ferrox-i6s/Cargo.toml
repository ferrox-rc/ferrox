[package]
name = "ferrox-i6s"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ferrox_i6s"
path = "src/lib.rs"

[[bin]]
name = "ferrox-i6s"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrox-core = { path = "../../crates/ferrox-core", features = ["board-i6s"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt"] }
embedded-graphics = "0.8.1"
usb-device = "0.3.2"
stm32-usbd = "0.8.0"
usbd-hid = "0.10.2"
usbd-serial = "0.2.2"

[features]
default = ["stm32"]
stm32 = ["ferrox-core/stm32"]
apm32 = ["ferrox-core/apm32"]

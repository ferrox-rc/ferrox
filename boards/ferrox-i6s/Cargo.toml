[package]
name = "ferrox-i6s"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ferrox_i6s"
path = "src/lib.rs"

[[bin]]
name = "ferrox-i6s"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrox-core = { path = "../../crates/ferrox-core", default-features = false, features = ["board-i6s"] }
ferrox-stm32f0 = { path = "../../crates/ferrox-stm32f0", default-features = false }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072", "rt"] }
embedded-graphics = "0.8.1"

[features]
default = [
    "stm32",
    "touch",
    "rf-afhds2a",
    "rf-crsf",
    "rf-cc2500",
    "rf-dsm",
    "dsm-fwd-prog",
    "logical-switches",
]
stm32 = ["ferrox-core/stm32", "ferrox-stm32f0/stm32"]
apm32 = ["ferrox-core/apm32", "ferrox-stm32f0/apm32"]
touch = ["ferrox-core/touch"]
rf-afhds2a = ["ferrox-core/rf-afhds2a"]
rf-crsf = ["ferrox-core/rf-crsf"]
rf-cc2500 = ["ferrox-core/rf-cc2500"]
rf-dsm = ["ferrox-core/rf-dsm"]
dsm-fwd-prog = ["ferrox-core/dsm-fwd-prog"]
soaring = ["ferrox-core/soaring"]
logical-switches = ["ferrox-core/logical-switches"]
multiswitch = ["ferrox-core/multiswitch", "ferrox-stm32f0/multiswitch"]

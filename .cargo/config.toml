[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip STM32F072VB"
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F407VET6"
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[alias]
build-i6s = "build --release -p ferrox-i6s"
build-i6x = "build --release -p ferrox-i6x"
build-pocket = "build --release -p ferrox-f4 --target thumbv7em-none-eabihf"
build-pocket-sd = "build --release -p ferrox-f4 --features edgetx-bootloader --target thumbv7em-none-eabihf"
build-boxer = "build --release -p ferrox-f4 --no-default-features --features boxer --target thumbv7em-none-eabihf"
build-zorro = "build --release -p ferrox-f4 --no-default-features --features zorro --target thumbv7em-none-eabihf"
build-tx12 = "build --release -p ferrox-f4 --no-default-features --features tx12 --target thumbv7em-none-eabihf"
build-qx7 = "build --release -p ferrox-f4 --no-default-features --features qx7 --target thumbv7em-none-eabihf"
build-tprov2 = "build --release -p ferrox-f4 --no-default-features --features tprov2 --target thumbv7em-none-eabihf"
build-t12 = "build --release -p ferrox-f4 --no-default-features --features t12 --target thumbv7em-none-eabihf"
build-x9d = "build --release -p ferrox-f4 --no-default-features --features x9d --target thumbv7em-none-eabihf"
build-x9e = "build --release -p ferrox-f4 --no-default-features --features x9e --target thumbv7em-none-eabihf"
build-at9spro = "build --release -p ferrox-f4 --no-default-features --features at9spro --target thumbv7em-none-eabihf"
build-gx12 = "build --release -p ferrox-f4 --no-default-features --features gx12 --target thumbv7em-none-eabihf"
test-host-i6s = "test -p ferrox-core --features board-i6s --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host-i6x = "test -p ferrox-core --features board-i6x --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host-pocket = "test -p ferrox-core --features board-pocket --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host-gx12 = "test -p ferrox-core --features board-gx12 --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host = "test-host-i6s"
test-all = "test-host-i6s"

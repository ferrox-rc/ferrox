[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip STM32F072VB"
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F407VET6"
rustflags = [
  "-C", "link-arg=-Tlink.x",
]

[alias]
build-i6s = "build --release -p ferrox-i6s"
build-i6x = "build --release -p ferrox-i6x"
build-pocket = "build --release -p ferrox-pocket --target thumbv7em-none-eabihf"
test-host-i6s = "test -p ferrox-core --features board-i6s --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host-i6x = "test -p ferrox-core --features board-i6x --lib --target x86_64-unknown-linux-gnu -- --test-threads=1"
test-host-pocket = "test -p ferrox-core --features board-pocket --lib --target x86_64-unknown-linux-gnu -- --test-threads=1 --skip test_dynamic_mixer_source_and_switch_availability"
test-host = "test-host-i6s"
test-all = "test-host-i6s"



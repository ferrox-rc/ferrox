[workspace]
members = [
    "crates/ferrox-core",
    "crates/ferrox-stm32f0",
    "crates/ferrox-stm32f4",
    "boards/ferrox-i6s",
    "boards/ferrox-i6x",
    "boards/ferrox-pocket",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.2"
edition = "2021"
authors = ["Bryan Souza", "FlySky Reverse Engineering Community"]
license = "GPL-3.0-only"
repository = "https://github.com/ferrox-rc/ferrox"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Enable Link-Time Optimization
codegen-units = 1   # Maximize LTO optimization across crates
panic = "abort"     # Remove stack unwinding overhead
debug = true        # Keep debug symbols for probe-rs / GDB
